<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .input-group { margin: 10px 0; }
        label { display: inline-block; width: 200px; }
        input { padding: 5px; }
        .button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .disabled { opacity: 0.5; pointer-events: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Paramètres</h1>
    <h3>Zigbee:</h3>
    <form id="configForm">
        <div class="input-group">
            <label>Mode de fonctionnement :</label>
            <label><input type="radio" name="mode" value="router" checked> Routeur</label>
            <label><input type="radio" name="mode" value="coordinator"> Coordinateur</label>
        </div>
        <div class="input-group">
            <label for="ieeeAddrW100">Adresse IEEE du W100 (ex: 0x0123456789abcdef):</label>
            <input type="text" id="ieeeAddrW100" name="ieeeAddrW100" pattern="^0x[0-9a-fA-F]{16}$" required>
        </div>
        <div class="input-group long-adresses">
            <label for="ieeeAddrRelay">Adresse IEEE du Relais (ex: 0xfedcba9876543210):</label>
            <input type="text" id="ieeeAddrRelay" name="ieeeAddrRelay" pattern="^0x[0-9a-fA-F]{16}$" required>
        </div>
        <div class="input-group short-addresses">
            <label for="shortAddrW100">Adresse courte du W100 (ex: 0x0a1b):</label>
            <input type="text" id="shortAddrW100" name="shortAddrW100" pattern="^0x[0-9a-fA-F]{4}$" required>
        </div>
        <div class="input-group short-addresses">
            <label for="shortAddrRelay">Adresse courte du Relais (ex: 0x2c3d):</label>
            <input type="text" id="shortAddrRelay" name="shortAddrRelay" pattern="^0x[0-9a-fA-F]{4}$" required>
        </div>
        <div class="input-group delay">
            <h3>Temps en secondes des reporting paramétrés (permet de vérifier si le reporting se fait bien):</h3>
            <p></p>
            <label for="w100_delay_param">     température du W100: </label>
            <input type="text" id="w100_delay_param" name="w100_delay_param" pattern="[0-9]{4}$" required> s
            <p></p>
            <label for="relay_delay_param">     relais: </label>
            <input type="text" id="relay_delay_param" name="relay_delay_param" pattern="[0-9]{4}$" required> s
            <p></p>
        </div>
        <button type="button" class="button" onclick="saveConfig()">Sauvegarder</button>
        <button type="button" class="button" onclick="cancelConfig()">Annuler</button>
    </form>

    <script>
        // Charger les valeurs depuis NVS au démarrage
        window.onload = function() {
            fetch('/getConfig')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to fetch config');
                    return response.json();
                })
                .then(data => {
                    console.log('Received config data:', data);
                    if (data.mode) {
                        document.querySelector(`input[name="mode"][value="${data.mode}"]`).checked = true;
                    } else {
                        document.querySelector('input[name="mode"][value="router"]').checked = true; // Default
                    }
                    if (data.ieeeAddrW100) document.getElementById('ieeeAddrW100').value = data.ieeeAddrW100;
                    if (data.ieeeAddrRelay) document.getElementById('ieeeAddrRelay').value = data.ieeeAddrRelay;
                    if (data.shortAddrW100) document.getElementById('shortAddrW100').value = data.shortAddrW100;
                    if (data.shortAddrRelay) document.getElementById('shortAddrRelay').value = data.shortAddrRelay;
                    if (data.w100_delay_param) document.getElementById('w100_delay_param').value = data.w100_delay_param;
                    if (data.relay_delay_param) document.getElementById('relay_delay_param').value = data.relay_delay_param;
                })
                .catch(error => console.error('Error loading config:', error));
        };

        function saveConfig() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const ieeeAddrW100 = document.getElementById('ieeeAddrW100').value;
            const ieeeAddrRelay = document.getElementById('ieeeAddrRelay').value;
            const shortAddrW100 = document.getElementById('shortAddrW100').value;
            const shortAddrRelay = document.getElementById('shortAddrRelay').value;
            const w100_delay_param = document.getElementById('w100_delay_param').value;
            const relay_delay_param = document.getElementById('relay_delay_param').value;

            if (!shortAddrW100.match(/^0x[0-9a-fA-F]{4}$/) || !shortAddrRelay.match(/^0x[0-9a-fA-F]{4}$/) || !ieeeAddrRelay.match(/^0x[0-9a-fA-F]{16}$/) || !ieeeAddrW100.match(/^0x[0-9a-fA-F]{16}$/)) {
                alert("Veuillez entrer des adresses valides pour Zigbee.");
                return;
            }
            if (!w100_delay_param.match(/^[0-9]{1,4}$/) || !relay_delay_param.match(/^[0-9]{1,4}$/)) {
                alert("Veuillez entrer des délais valides (jusqu'à 4 chiffres).");
                return;
            }

            fetch('/saveConfig', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode, ieeeAddrW100, ieeeAddrRelay, shortAddrW100, shortAddrRelay, w100_delay_param, relay_delay_param })
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('configForm').innerHTML = '<p>Configuration sauvegardée, retour sur la page principale dans 5 secondes...</p>';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 5000);
                } else {
                    throw new Error('Erreur lors de la sauvegarde');
                }
            })
            .catch(error => {
                document.getElementById('configForm').innerHTML = '<p>Configuration sauvegardée (redémarrage en cours), retour automatique dans 5 secondes...</p>';
                setTimeout(() => {
                    window.location.href = '/';
                }, 5000);
            });
        }

        function cancelConfig() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
