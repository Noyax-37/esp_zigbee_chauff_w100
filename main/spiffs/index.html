<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Thermostat Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: auto; }
        .input-group { margin: 10px 0; }
        .error-message {
            color: red;
            font-weight: bold;
            display: none; /* Restauré pour être contrôlé dynamiquement */
        }
        label { display: inline-block; width: 150px; }
        input[type="number"] { padding: 5px; width: 100px; }
        button { padding: 5px 10px; margin: 5px 0; }
        #update_status { color: blue; }
        #relay_mismatch { color: red; }
    #relay_icon {
      font-size: 2em;
      margin-left: 10px;
      transition: color 0.3s ease, transform 0.3s ease;
    }
    
    </style>
</head>
<body>
    <div class="container">
        <h1>Thermostat Control V1.0</h1>
        <div id="errorMessage" class="error-message">
            <span id="errorMessageText"></span>
        </div>
        <div class="input-group">
            <label for="temperature">Temperature:</label> <span id="temperature">N/A</span> °C
        </div>
        <div class="input-group">
            <label for="humidity">Humidité:</label> <span id="humidity">N/A</span>
        </div>
        <div class="input-group">
            <label for="setpoint">Point de chauffe:</label> <span id="setpoint">N/A</span> °C
        </div>
        <div class="input-group">
            <label for="high_hyst">Hysteresis +:</label> <span id="high_hyst">N/A</span> °C
        </div>
        <div class="input-group">
            <label for="low_hyst">Hysteresis -:</label> <span id="low_hyst">N/A</span> °C
        </div>
        <div class="input-group">
            <label>Commande Relais:</label> 
            <span id="relay_commanded">N/A</span>
            <span id="relay_mismatch" style="display:none;">(Mismatch)</span>
            <p><label for="relay">Position Relais:</label> 
            <span id="relay_actual">N/A</span>
            <span id="relay_mismatch" style="display:none;">(Mismatch)</span>
            </p>
            <p>État du chauffage :
                <i id="relay_icon" class="fas fa-question-circle" style="color: orange; font-size: 2em; margin-left: 10px;"></i>
            </p>
        </div>
        <div id="update_status" style="color: blue;"></div>
        <div class="input-group">
            <label for="new_setpoint">Nouveau Point de Chauffe:</label>
            <input type="number" id="new_setpoint" step="0.1" value="19.0">
            <button onclick="startUpdateSetpoint()">Mise à jour point de chauffe</button>
        </div>
        <div class="input-group">
            <label for="new_high_hyst">Nouvel Hysteresis +:</label>
            <input type="number" id="new_high_hyst" step="0.1" value="0.1">
            <button onclick="startUpdateHighHysteresis()">Mise à jour Hysteresis +</button>
        </div>
        <div class="input-group">
            <label for="new_low_hyst">Nouvel Hysteresis -:</label>
            <input type="number" id="new_low_hyst" step="0.1" value="0.1">
            <button onclick="startUpdateLowHysteresis()">Mise à jour Hysteresis -</button>
        </div>
        <div class="input-group">
            <label>Mode HVAC:</label>
            <button onclick="sendHvacOn()">Mode HVAC ON</button>
        </div>
        <div class="input-group">
            <label>          </label>
            <button onclick="sendHvacOFF()">Mode HVAC OFF</button>
        </div>
        <div class="input-group">
            <label for="p_pmtsd">Power (0=ON, 1=OFF):</label>
            <input type="number" id="p_pmtsd" value="0">
        </div>
        <div class="input-group">
            <label for="m_pmtsd">Mode (0=Cooling, 1=Heating, 2=Auto):</label>
            <input type="number" id="m_pmtsd" value="1">
        </div>
        <div class="input-group">
            <label for="t_pmtsd">Température:</label>
            <input type="number" id="t_pmtsd" value="20.5" step="0.1">
        </div>
        <div class="input-group">
            <label for="s_pmtsd">Speed (de 0 auto à 4):</label>
            <input type="number" id="s_pmtsd" value="0">
        </div>
        <div class="input-group">
            <label for="d_pmtsd">D = à définir... 0 ou 1:</label>
            <input type="number" id="d_pmtsd" value="0">
        </div>
        <div class="input-group">
            <label>Rangée Centrale (PMTSD):</label>
            <button onclick="sendPmtsd()">Envoyer PMTSD</button>
        </div>
        <div class="input-group">
            <label for="operating_time">Temps de fonctionnement :</label> <span id="operating_time"> 0j 00h 00mn </span>
        </div>

<script>
    let updateInterval = null;
    let updateIntervalStatus = null;

    function fetchData() {
        fetch('/data', { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok ' + response.status);
                return response.text();
            })
            .then(text => {
                try {
                    if (text.trim() === '') return;
                    const data = JSON.parse(text);
                    document.getElementById('temperature').textContent = data.temperature !== undefined && data.temperature !== '0.0' ? data.temperature : 'N/A';
                    document.getElementById('humidity').textContent = data.humidity !== undefined && data.humidity !== '0.0' ? `${data.humidity} ${String.fromCharCode(0x0025)}` : 'N/A';
                    document.getElementById('setpoint').textContent = data.setpoint !== undefined && data.setpoint !== '0.0' ? data.setpoint : 'N/A';
                    document.getElementById('high_hyst').textContent = data.high_hyst !== undefined && data.high_hyst !== '0.0' ? data.high_hyst : 'N/A';
                    document.getElementById('low_hyst').textContent = data.low_hyst !== undefined && data.low_hyst !== '0.0' ? data.low_hyst : 'N/A';
                    document.getElementById('relay_actual').textContent = data.relay_actual || 'N/A';
                    document.getElementById('relay_commanded').textContent = data.relay_commanded || 'N/A';
                    document.getElementById('update_status').textContent = data.update_status || '';

                    // Effacer update_status après 5 secondes si le message indique un succès
                    if (data.update_status === 'Setpoint modifié avec succès') {
                        setTimeout(() => {
                            document.getElementById('update_status').textContent = '';
                        }, 5000);
                    }

                    const relayActual = document.getElementById('relay_actual').textContent;
                    const relayCommanded = document.getElementById('relay_commanded').textContent;
                    const mismatchSpan = document.getElementById('relay_mismatch');
                    if (relayActual !== 'N/A' && relayCommanded !== 'N/A' && relayActual !== relayCommanded) {
                        mismatchSpan.style.display = 'inline';
                    } else {
                        mismatchSpan.style.display = 'none';
                    }

                    if (!data.update_status && updateInterval) {
                        clearInterval(updateInterval);
                        updateInterval = null;
                    }
                } catch (e) {
                    console.error('Invalid JSON:', text, e);
                    document.getElementById('update_status').textContent = 'Error: Invalid data received in fetchData';
                }
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    function startUpdate(operation, value, urlParam) {
        if (updateInterval) {
            clearInterval(updateInterval);
            clearInterval(updateIntervalStatus);
        }
        updateInterval = setInterval(fetchData, 1000);

        checkZigbeeStatus();
        updateIntervalStatus = setInterval(checkZigbeeStatus, 1000);

        fetch('/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `${urlParam}=${encodeURIComponent(value)}`
        })
        .then(response => {
            if (!response.ok) throw new Error('Update failed ' + response.status);
            return response.text();
        })
        .then(text => {
            try {
                const data = JSON.parse(text);
                document.getElementById('temperature').textContent = data.temperature !== undefined && data.temperature !== '0.0' ? data.temperature : 'N/A';
                document.getElementById('humidity').textContent = data.humidity !== undefined && data.humidity !== '0.0' ? `${data.humidity} ${String.fromCharCode(0x0025)}` : 'N/A';
                document.getElementById('setpoint').textContent = data.setpoint !== undefined && data.setpoint !== '0.0' ? data.setpoint : 'N/A';
                document.getElementById('high_hyst').textContent = data.high_hyst !== undefined && data.high_hyst !== '0.0' ? data.high_hyst : 'N/A';
                document.getElementById('low_hyst').textContent = data.low_hyst !== undefined && data.low_hyst !== '0.0' ? data.low_hyst : 'N/A';
                document.getElementById('relay_actual').textContent = data.relay_actual || 'N/A';
                document.getElementById('relay_commanded').textContent = data.relay_commanded || 'N/A';
                document.getElementById('update_status').textContent = data.update_status || '';

                const relayActual = document.getElementById('relay_actual').textContent;
                const relayCommanded = document.getElementById('relay_commanded').textContent;
                const mismatchSpan = document.getElementById('relay_mismatch');
                if (relayActual !== 'N/A' && relayCommanded !== 'N/A' && relayActual !== relayCommanded) {
                    mismatchSpan.style.display = 'inline';
                } else {
                    mismatchSpan.style.display = 'none';
                }
            } catch (e) {
                console.error('Invalid JSON from POST:', text, e);
                document.getElementById('update_status').textContent = 'Error: Invalid data received in startUpdate';
            }
        })
        .catch(error => console.error('Error updating:', error));
    }

    function checkZigbeeStatus() {
        fetch('/status', { cache: 'no-store' })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.status);
                    if (!updateInterval) {
                        document.getElementById('errorMessageText').textContent = 'Problème réseau, vérifiez la connexion WIFI';
                        document.getElementById('errorMessageText').style.display = 'block';
                    }
                }
                return response.text();
            })
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    const errorMessage = document.getElementById('errorMessage');
                    const errorMessageText = document.getElementById('errorMessageText');
                    if (!errorMessage || !errorMessageText) {
                        console.error('Error message elements not found');
                        return;
                    }

                    if (data.status && data.status.trim() !== '') {
                        errorMessageText.textContent = data.status;
                        errorMessage.style.display = 'block'; // Afficher si un message existe
                    } else {
                        errorMessageText.textContent = '';
                        errorMessage.style.display = 'none'; // Cacher si pas de message
                    }

                    if (!updateInterval) {
                        clearInterval(updateIntervalStatus);
                        updateIntervalStatus = null;
                    }
                } catch (e) {
                    console.error('Invalid JSON from /status:', text, e);
                    const errorMessage = document.getElementById('errorMessage');
                    const errorMessageText = document.getElementById('errorMessageText');
                    if (errorMessage && errorMessageText) {
                        errorMessageText.textContent = 'Erreur: Données invalides reçues de /status';
                        errorMessage.style.display = 'block';
                    }
                }
            })
            .catch(error => {
                console.error('Error fetching status:', error);
                const errorMessage = document.getElementById('errorMessage');
                const errorMessageText = document.getElementById('errorMessageText');
                if (errorMessage && errorMessageText) {
                    errorMessageText.textContent = 'Erreur réseau: Impossible de contacter /status';
                    errorMessage.style.display = 'block';
                }
            });
    }

    function startUpdateSetpoint() {
        const setpoint = document.getElementById('new_setpoint').value;
        startUpdate('setpoint', setpoint, 'setpoint');
    }

    function startUpdateHighHysteresis() {
        const high_hyst = document.getElementById('new_high_hyst').value;
        startUpdate('high_hyst', high_hyst, 'high_hyst');
    }

    function startUpdateLowHysteresis() {
        const low_hyst = document.getElementById('new_low_hyst').value;
        startUpdate('low_hyst', low_hyst, 'low_hyst');
    }

    function update_operating_time() {
        fetch('/operating_time', { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok ' + response.status);
                return response.text();
            })
            .then(text => {
                document.getElementById('operating_time').textContent = text || '0j 00h 00mn';
            })
            .catch(error => console.error('Error fetching function time:', error));
    }

function sendHvacOn() {
        fetch('/hvac_on', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: ''
        })
        .then(response => {
            if (!response.ok) throw new Error('HVAC ON failed ' + response.status);
            return response.text();
        })
        .then(text => {
            try {
                const data = JSON.parse(text);
                document.getElementById('update_status').textContent = data.status || 'HVAC ON command sent';
                setTimeout(() => {
                    document.getElementById('update_status').textContent = '';
                }, 5000);
            } catch (e) {
                console.error('Invalid JSON from /hvac_on:', text, e);
                document.getElementById('update_status').textContent = 'Error: Invalid response from /hvac_on';
            }
        })
        .catch(error => {
            console.error('Error sending HVAC ON:', error);
            document.getElementById('update_status').textContent = 'Error: Failed to send HVAC ON command';
        });
    }

    function sendHvacOFF() {
        fetch('/hvac_off', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: ''
        })
        .then(response => {
            if (!response.ok) throw new Error('HVAC OFF failed ' + response.status);
            return response.text();
        })
        .then(text => {
            try {
                const data = JSON.parse(text);
                document.getElementById('update_status').textContent = data.status || 'HVAC OFF command sent';
                setTimeout(() => {
                    document.getElementById('update_status').textContent = '';
                }, 5000);
            } catch (e) {
                console.error('Invalid JSON from /hvac_off:', text, e);
                document.getElementById('update_status').textContent = 'Error: Invalid response from /hvac_off';
            }
        })
        .catch(error => {
            console.error('Error sending HVAC OFF:', error);
            document.getElementById('update_status').textContent = 'Error: Failed to send HVAC OFF command';
        });
    }

function sendPmtsd() {
    console.log('sendPmtsd called'); // Log pour vérifier que la fonction est appelée
    const p_pmtsd = parseInt(document.getElementById('p_pmtsd').value);
    const m_pmtsd = parseInt(document.getElementById('m_pmtsd').value);
    const t_pmtsd = parseFloat(document.getElementById('t_pmtsd').value);
    const s_pmtsd = parseInt(document.getElementById('s_pmtsd').value);
    const d_pmtsd = parseInt(document.getElementById('d_pmtsd').value);

    // Validation des entrées
    if (isNaN(p_pmtsd) || isNaN(m_pmtsd) || isNaN(t_pmtsd) || isNaN(s_pmtsd) || isNaN(d_pmtsd)) {
        console.error('Invalid input: All PMTSD fields must be valid numbers');
        document.getElementById('update_status').textContent = 'Erreur : Tous les champs PMTSD doivent être remplis avec des nombres valides';
        return;
    }
    if (p_pmtsd < 0 || p_pmtsd > 1 || m_pmtsd < 0 || m_pmtsd > 2 || t_pmtsd < 5.0 || t_pmtsd > 30.0 || s_pmtsd < 0 || s_pmtsd > 4 || d_pmtsd < 0) {
        console.error('Invalid range: P(0-1), M(0-2), T(5.0-30.0), S(0-4), D(0-1)', { p_pmtsd, m_pmtsd, t_pmtsd, s_pmtsd, d_pmtsd });
        document.getElementById('update_status').textContent = 'Erreur : Valeurs PMTSD hors des plages valides (P:0-1, M:0-2, T:5.0-30.0, S:0-4, D:0-1)';
        return;
    }

    const body = `p_pmtsd=${encodeURIComponent(p_pmtsd)}&m_pmtsd=${encodeURIComponent(m_pmtsd)}&t_pmtsd=${encodeURIComponent(t_pmtsd)}&s_pmtsd=${encodeURIComponent(s_pmtsd)}&d_pmtsd=${encodeURIComponent(d_pmtsd)}`;
    console.log('Sending POST to /pmtsd with body:', body);

    fetch('/pmtsd', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
    })
    .then(response => {
        console.log('Response status:', response.status);
        if (!response.ok) throw new Error('PMTSD failed: ' + response.status);
        return response.text();
    })
    .then(text => {
        console.log('Response text:', text);
        try {
            const data = JSON.parse(text);
            document.getElementById('update_status').textContent = data.status || 'Commande PMTSD envoyée';
            setTimeout(() => {
                document.getElementById('update_status').textContent = '';
            }, 5000);
        } catch (e) {
            console.error('Invalid JSON from /pmtsd:', text, e);
            document.getElementById('update_status').textContent = 'Erreur : Réponse invalide depuis /pmtsd';
        }
    })
    .catch(error => {
        console.error('Error sending PMTSD:', error);
        document.getElementById('update_status').textContent = 'Erreur : Échec de l\'envoi de la commande PMTSD - ' + error.message;
    });
}

    fetchData();
    update_operating_time();
    setInterval(fetchData, 5000);
    setInterval(update_operating_time, 60000);
</script>
    </div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
    const relaySpan = document.getElementById("relay_actual");
    const icon = document.getElementById("relay_icon");

    function updateIcon(state) {
        icon.classList.remove("pulse");

        if (state === "ON") {
        icon.className = "fas fa-fire pulse";
        icon.style.color = "red";
        } else if (state === "OFF") {
        icon.className = "fas fa-fire";
        icon.style.color = "gray";
        } else {
        icon.className = "fas fa-question-circle";
        icon.style.color = "orange";
        }
    }

    const observer = new MutationObserver(() => {
        const state = relaySpan.textContent.trim();
        updateIcon(state);
    });

    observer.observe(relaySpan, { childList: true, subtree: true });

    // Mise à jour initiale
    updateIcon(relaySpan.textContent.trim());
    });
</script>
</body>
</html>
